{% set name = "UkPostcodeParser" %}
{% set version = "1.1.2" %}
{% set sha256 = "930264efa293db80af0103a4fe9c161b06365598d24bb6fe5403f3f57c70530e" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python
  script: python setup.py install --single-version-externally-managed --record record.txt

requirements:
  host:
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - ukpostcodeparser

about:
  home: https://github.com/hamstah/ukpostcodeparser
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'UK Postcode parser'
  description: 
    UK Postcode parser
  doc_url: https://github.com/hamstah/ukpostcodeparser
  dev_url: https://github.com/hamstah/ukpostcodeparser

extra:
  recipe-maintainers:
    - cshaley
    - sannykr
